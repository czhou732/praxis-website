name: Deploy static content to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  # Weekly rebuild so the ICS subscription feed refreshes even when no push
  # has landed (e.g., a speaker edit made in soft copy). Sundays 06:00 UTC.
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # `npm run build` ends in scripts/verify-build.mjs, which fails the job if
      # any page is missing from dist, any internal link dangles, or a page ships
      # without prerendered markup. A broken build never reaches deployment.
      - name: Build and verify
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pages edges take a moment to pick up a new deployment.
      - name: Wait for propagation
        run: sleep 45
      - name: Smoke test the live site
        run: npm run smoke
